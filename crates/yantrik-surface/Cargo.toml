[package]
name = "yantrik-surface"
version = "0.1.0"
edition = "2021"
description = "Put something where a mind can find it: the app.describe / app.act dispatch, with no UI dependency"

[dependencies]
serde_json = { workspace = true }
tracing = { workspace = true }
# The socket is served by the transport's async server; `answer_later` steps a waiting call out
# of the way of the others with `block_in_place`, which needs the multi-threaded runtime.
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
