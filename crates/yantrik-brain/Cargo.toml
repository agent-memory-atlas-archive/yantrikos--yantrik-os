[package]
name = "yantrik-brain"
version = "0.1.0"
edition = "2021"
description = "LLM-free cognition engine for Yantrik OS — homeostasis, signal detectors, curiosity, and consolidation over a plain SQLite connection."

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The unit tests mint candidate ids and nothing else here needs one, so this is
# test-only rather than a dependency of the crate proper. Without it the tests do
# not compile at all, which is how they came to be unrun.
uuid7 = { workspace = true }
