# plymouth-quit.service.d/yantrik-splash.conf — plymouth quits with --retain-splash, bounded, as
# yantrik-splash-release.service does before tty1's autologin: stock, `plymouth quit` here clears the
# screen to black. Usually a no-op by now, since the release has already run.
[Service]
ExecStart=
ExecStart=-/usr/lib/yantrik/boot-unlock/splash release
TimeoutStartSec=20
