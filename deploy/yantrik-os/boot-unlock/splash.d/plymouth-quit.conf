# plymouth-quit.service.d/yantrik-splash.conf — plymouth is quit once the shell has drawn its first
# frame, with --retain-splash, not at multi-user.target: stock, the screen is black from here
# until the shell draws (/usr/lib/yantrik/boot-unlock/splash). It waits in the background (exec),
# so nothing else at boot waits on it.
[Service]
Type=exec
ExecStart=
ExecStart=-/usr/lib/yantrik/boot-unlock/splash handoff
