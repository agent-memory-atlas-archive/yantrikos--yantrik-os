# plymouth-quit-wait.service.d/yantrik-splash.conf — the gettys are ordered after this unit, and
# stock it waits for plymouth to exit. plymouth now stays until the shell has drawn, which is after
# tty1's autologin, so waiting here would hold tty1 and the serial console's login prompt (the CI
# boot test's `login:`) until the splash timed out. Nothing waits: tty1's getty lets plymouth go
# itself (getty@tty1.service.d/yantrik-splash.conf), and the other consoles never draw under it.
[Service]
ExecStart=
ExecStart=/bin/true
