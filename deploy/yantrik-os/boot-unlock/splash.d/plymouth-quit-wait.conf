# plymouth-quit-wait.service.d/yantrik-splash.conf — the gettys are ordered after this unit, and
# stock it waits, unbounded, for plymouthd to exit. plymouth now stays until the shell has drawn,
# after tty1's autologin, so waiting here would hold tty1 and the serial console's login prompt
# (the CI boot test's `login:`). Nothing waits: tty1's getty orders itself after the deactivation
# (getty-tty1.conf), and no other console draws under plymouth.
[Service]
ExecStart=
ExecStart=/bin/true
