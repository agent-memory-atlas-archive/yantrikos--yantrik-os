# getty@tty1.service.d/yantrik-splash.conf — before tty1's autologin starts the desktop, plymouth
# lets go of the display and keeps its last frame, the Yantrik emblem, on the screen
# (/usr/lib/yantrik/boot-unlock/splash). A no-op when plymouth is not running. Every plymouth call
# in it is bounded, and the whole step is too: whatever plymouth does, autologin is never held
# more than 15 s (a plymouthd that stopped answering held it two minutes on real boots, #820).
[Service]
ExecStartPre=-/usr/bin/timeout -k 2 15 /usr/lib/yantrik/boot-unlock/splash deactivate
