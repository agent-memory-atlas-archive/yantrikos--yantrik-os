# getty@tty1.service.d/yantrik-splash.conf — tty1's autologin starts only after plymouth has let go
# of tty1 and the display, leaving the emblem on the screen (yantrik-splash-release.service).
#
# Ordering only, never an Exec* line: systemd takes tty1 for every Exec* line of this unit before
# running it, and waits while plymouthd holds the VT, so a hand-off run from here waited for
# itself, about two minutes on real boots (#820). The selftest holds this file to no Exec* line.
# Wants, not Requires: if the release fails, the autologin still starts.
[Unit]
Wants=yantrik-splash-release.service
After=yantrik-splash-release.service
