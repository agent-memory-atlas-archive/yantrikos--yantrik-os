# getty@tty1.service.d/yantrik-splash.conf — before tty1's autologin starts the desktop, plymouth
# lets go of the display and keeps its last frame, the Yantrik emblem, on the screen
# (/usr/lib/yantrik/boot-unlock/splash). A no-op when plymouth is not running.
[Service]
ExecStartPre=-/usr/lib/yantrik/boot-unlock/splash deactivate
