# getty@tty1.service.d/yantrik-splash.conf — tty1's autologin starts the desktop under the boot
# splash's last frame, without waiting on plymouth and without clearing the screen.
#
# - After yantrik-splash-deactivate.service, which makes plymouth let go of the display but stay
#   alive: its exit would put the console's framebuffer on the screen (#820). Wants, not Requires.
# - tty-force: plymouthd may still hold tty1, and plain `tty` waited for it, two minutes on real
#   SeaBIOS boots (#820). plymouth reads no keys once deactivated.
# - No reset, hangup or disallocation of tty1: each switches it to text and puts the console on the
#   screen, black with a cursor, until labwc draws. agetty clears its own screen as before.
# - Ordering only, never an Exec* line: systemd takes tty1 for every Exec* line of this unit
#   before running it. The selftest holds this file to that.
[Unit]
Wants=yantrik-splash-deactivate.service
After=yantrik-splash-deactivate.service

[Service]
StandardInput=tty-force
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
