# Yantrik Live on yantrikos.com. Included in the site's TLS server block by setup-relay.sh.
# ^~ keeps the site's regex rules (its 30-day asset cache) off these paths.

# The page: its own directory, so a deploy of the website never removes it.
location ^~ /live/ {
    alias /var/www/yantrikos-live/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self'; img-src 'self' data:; worker-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

# The video: MediaMTX's HLS, read-only, from loopback. Nothing else of MediaMTX is reachable.
location ^~ /live/hls/ {
    proxy_pass http://127.0.0.1:8888/live/;
    # MediaMTX sends a new viewer to /live/index.m3u8?cookieCheck=1 first: its own path, which
    # here would be the page. Point the redirect back under /live/hls/.
    proxy_redirect /live/ /live/hls/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering on;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
