<!doctype html>
<html><head><meta charset="utf-8"><title>Tricky Page</title></head>
<body>
<!-- A page that tries: an element named like the reader's registry, and one named like the
     document's own title, which is what document.title reads on every world. -->
<div id="__yb">not the reader</div>
<img name="title" alt="">

<h1>Tricks</h1>

<!-- Rails: a link with an address that deletes, confirmed by a dialog with no commitment word. -->
<a id="rails" href="/pages/other.html" data-method="delete"
   onclick="event.preventDefault(); if (confirm('Are you sure?')) document.title = 'RAILS DELETED';">Delete</a>

<!-- A link that only goes to a form, and a link that is the order itself. -->
<a href="/pages/other.html">submit</a>
<a href="/pages/other.html" onclick="event.preventDefault(); document.title = 'LINK ORDERED';">Place order</a>

<!-- A clickable card whose middle is the Buy button. -->
<div id="card" style="cursor:pointer; padding:30px; width:220px; border:1px solid #999">
  <button id="buy" style="width:200px;height:60px" onclick="document.title = 'CARD BOUGHT'">Buy now</button>
</div>

<!-- A chat composer: no form; Enter sends. -->
<div id="composer">
  <textarea id="msg" aria-label="Message" onkeydown="if (event.key === 'Enter') { event.preventDefault(); document.title = 'MESSAGE SENT'; }"></textarea>
  <button onclick="document.title = 'MESSAGE SENT'">Send</button>
</div>

<!-- A button outside its form, tied to it with form= -->
<form id="pay" onsubmit="event.preventDefault(); document.title = 'PAID';"><input id="amount" aria-label="Amount"></form>
<button type="submit" form="pay">Pay now</button>

<!-- A list that acts when it changes. -->
<select id="bulk" aria-label="Bulk action" onchange="if (this.value === 'del') document.title = 'BULK DELETED';">
  <option value="">Choose…</option><option value="del">Delete selected</option><option value="arch">Archive selected</option>
</select>

<button id="prompt" onclick="const v = prompt('Type DELETE to confirm'); if (v === 'DELETE') document.title = 'PROMPT DELETED';">Wipe data</button>

<button onclick="document.title = 'REVIEW POSTED'">Post review</button>
<button id="zwsp" onclick="document.title = 'ZW BOUGHT'">B&#8203;uy</button>
<input type="submit" form="pay">
</body></html>
