[package]
name = "weather-service"
version = "0.1.0"
edition = "2021"
description = "Yantrik weather service — Open-Meteo API, forecasts, AQI, alerts"

[[bin]]
name = "weather-service"
path = "src/main.rs"

[dependencies]
yantrik-ipc-contracts = { workspace = true }
yantrik-service-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Reads the machine's place out of the shell's settings.yaml; see src/machine_place.rs.
serde_yaml = { workspace = true }
ureq = { workspace = true }
