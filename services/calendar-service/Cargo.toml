[package]
name = "calendar-service"
version = "0.1.0"
edition = "2021"
description = "Yantrik calendar service — event CRUD, scheduling, file-based storage"

[[bin]]
name = "calendar-service"
path = "src/main.rs"

[dependencies]
yantrik-ipc-contracts = { workspace = true }
yantrik-service-sdk = { workspace = true }
# An event ten minutes from now is news, and the events are here — so the reminder is here too.
# The transport crate rather than `yantrik-app-runtime::notify`: the runtime pulls in Slint, and a
# headless service must not link a widget toolkit to make a socket call. That is the same rule
# that moved `service::ensure` out of the runtime in the first place.
yantrik-ipc-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid7 = { workspace = true }
tracing = { workspace = true }
