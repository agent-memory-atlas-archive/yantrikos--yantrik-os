[package]
id = "com.yantrikos.perception"
name = "Perception Service"
version = "0.1.0"
description = "The kernel's account of what is happening, and who did it"
publisher = "Yantrik OS"
roles = ["service"]
icon = "activity"

[[permissions]]
capability = "kernel.process_events"
reason = "Joins the netlink process connector so program launches are pushed rather than polled (CAP_NET_ADMIN, dropped after startup)"

[[permissions]]
capability = "kernel.file_events"
reason = "Watches the directories in its scope with fanotify, which reports which process wrote a file (CAP_SYS_ADMIN, dropped after startup)"

[service]
binary = "perception-service"
methods = [
    "perception.since",
    "perception.snapshot",
    "perception.scope",
]
# Not autostarted: the capabilities above are not the session's to grant, so a shell-started
# instance sees pressure and nothing else. Worth having when something asks —
# `start_service perception` brings it up, and it publishes a SourceFailed observation for each
# source it had to do without — and not worth running all session for nobody. A system unit or a
# binary with file capabilities gets the whole periphery; neither exists on a shipped machine yet.
autostart = false
