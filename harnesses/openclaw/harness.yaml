# What the desktop can say about OpenClaw before OpenClaw is running.
# See harnesses/pi/harness.yaml for why this file exists at all.
id: openclaw
name: OpenClaw
detail: The local-first personal agent, with its own memory
docs: README.md
unit: yantrik-openclaw.service

requires:
  - binary: openclaw
    why: OpenClaw itself — install it from its own documentation, which this README points at
  - binary: python3
    why: the harness is stdlib Python, and the image already carries it
  - file: yantrik_openclaw.py
    why: the harness script, staged beside this file

# No `install` command on purpose. OpenClaw's own documentation is the only thing that knows
# how to install OpenClaw, and a command invented here is a command that goes stale without
# anybody noticing — so the row says it is not installed and names the README instead of
# offering a button that would run a guess.

# No `setup` either: with no config file at all this harness runs `openclaw agent` with
# OpenClaw's own defaults, which is a working setup for somebody who has configured OpenClaw.
# ~/.config/yantrik/openclaw.json only exists to override that, and the README says so.
