[package]
name = "yantrik-app"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "YantrikApp: what every app's process is made of: its one instance, its window's chrome and event loop, its control surface for the Mind, and its theme"

# Step 1 of design/app-framework-2026-10-21.md: the modules below are yantrik-app-runtime's, moved
# here unchanged. The App trait and the runner (step 2) are built beside them.
[dependencies]
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The control surface serves JSON-RPC on its own thread; the transport server is async.
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
yantrik-foundation = { workspace = true }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
# The control surface's dispatch, with no UI; `control` adds the hop to the UI thread.
yantrik-surface = { workspace = true }

# geteuid, for checking the pid-file directory is really ours before trusting it (instance.rs).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
