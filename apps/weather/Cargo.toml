[package]
name = "yantrik-weather"
version = "0.1.0"
edition = "2021"
description = "Yantrik Weather — weather dashboard with forecasts and alerts, on YantrikApp"

# The app is a library the framework runs (`src/lib.rs`: the `App`), and a three-line binary.
# Its behaviour is tested headless through yantrik-testing, with fakes for the service and the
# Mind.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yantrik-weather"
path = "src/main.rs"

[dependencies]
yantrik-app = { workspace = true }
yantrik-services = { workspace = true }
yantrik-ipc-contracts = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Open-Meteo directly, when the weather service does not answer.
ureq = { workspace = true }

[dev-dependencies]
yantrik-testing = { workspace = true }
# A test's pin on Private mode for its own app (`control::private_mode::testing`).
yantrik-app = { workspace = true, features = ["testing"] }

[build-dependencies]
yantrik-app-build = { workspace = true }
