[package]
name = "yantrik-container-manager"
version = "0.1.0"
edition = "2021"
description = "Yantrik Container Manager — Docker/Podman container management, on YantrikApp"

# The app is a library the framework runs (`src/lib.rs`: the `App`), and a three-line binary.
# Its behaviour is tested headless through yantrik-testing, with a fake container runtime and a
# fake Mind.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yantrik-container-manager"
path = "src/main.rs"

[dependencies]
yantrik-app = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
yantrik-testing = { workspace = true }

[build-dependencies]
yantrik-app-build = { workspace = true }
