[package]
name = "yantrik-image-viewer"
version = "0.1.0"
edition = "2021"
description = "Yantrik Image Viewer — image display with zoom, rotate, slideshow, on YantrikApp"

# The app is a library the framework runs (`src/lib.rs`: the `App`), and a three-line binary.
# Its behaviour is tested headless through yantrik-testing, with a fake Mind and real files.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yantrik-image-viewer"
path = "src/main.rs"

[dependencies]
yantrik-app = { workspace = true }
yantrik-foundation = { workspace = true }
yantrik-ipc-contracts = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
yantrik-image-core = { workspace = true }
slint = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
yantrik-testing = { workspace = true }

[build-dependencies]
yantrik-app-build = { workspace = true }
