[package]
name = "yantrik-system-monitor"
version = "0.1.0"
edition = "2021"
description = "Yantrik System Monitor — real-time CPU, memory, disk, network, and process monitoring, on YantrikApp"

# The app is a library the framework runs (`src/lib.rs`: the `App`), and a three-line binary.
# Its behaviour is tested headless through yantrik-testing, with a fake machine and a fake Mind.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yantrik-system-monitor"
path = "src/main.rs"

[dependencies]
yantrik-app = { workspace = true }
yantrik-ipc-contracts = { workspace = true }
# The system-monitor service's three calls, raw, from jobs: yantrik-services has no client for
# this domain yet.
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sysinfo = { workspace = true }
# The local kill path signals through libc directly: errno is the only place the reason lives,
# and sysinfo's own kill answers with a bool that cannot tell ESRCH from EPERM.
libc = "0.2"

[dev-dependencies]
yantrik-testing = { workspace = true }
# A test's pin on Private mode for its own app (`control::private_mode::testing`).
yantrik-app = { workspace = true, features = ["testing"] }

[build-dependencies]
yantrik-app-build = { workspace = true }
