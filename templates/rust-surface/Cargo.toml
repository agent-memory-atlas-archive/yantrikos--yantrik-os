[package]
name = "my-surface"
version = "0.1.0"
edition = "2021"
description = "A to-do list a mind can read, add to, tick off and search — a Yantrik OS surface"
publish = false

# Rename: README.md, "Make it yours".

[lib]
name = "my_surface"
path = "src/lib.rs"

[[bin]]
name = "my-surface"
path = "src/main.rs"

[dependencies]
# Inside the yantrik-os repository this is the crate next door. Copied out of it, replace the
# line with the git dependency below (README.md, "Outside this repository"):
#
#   yantrik-surface = { git = "https://github.com/yantrikos/yantrik-os" }
#
yantrik-surface = { path = "../../crates/yantrik-surface" }
